# SonarQube Cloud automatic analysis settings. Owner-approved on 2026-11-04 for the M-0 split stack (stage s09).
# Each security-intake probe runs alone, read-only and network-less, mounted at /probe, so it cannot import a
# shared helper; its prelude is duplicated by design. Only duplication detection is excluded for these files:
# every other rule still analyzes them.
sonar.cpd.exclusions=security/intake/**/evaluation.test.mjs
