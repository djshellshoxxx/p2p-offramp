name: Specification inventory
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
      - name: Validate local links and catalog coverage
        run: python scripts/spec_audit.py --check-links
      - name: Verify committed inventory is current
        run: |
          python scripts/spec_audit.py --markdown docs/SPEC_READINESS.md
          git diff --exit-code -- docs/SPEC_READINESS.md
