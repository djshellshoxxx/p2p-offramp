name: Specification inventory
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, official ref checked 2026-10-24
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -v
      - name: Validate expanded structure, local links and catalog coverage
        run: python scripts/spec_audit.py --check
      - name: Verify committed inventory is current
        run: |
          python scripts/spec_audit.py --markdown docs/SPEC_READINESS.md
          git diff --exit-code -- docs/SPEC_READINESS.md
