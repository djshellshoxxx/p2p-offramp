name: Vault foundation
on:
  push:
    branches: [main]
  pull_request:
# Cancel superseded runs of the same workflow and ref (first-party feature, no new actions).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  local-evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/escrow-evm/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix packages/escrow-evm
      - run: npm run test:escrow
      - run: npm run test:local-evm
  schemas-and-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-24
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, official ref checked 2026-10-24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:proof-inputs
      - run: npm test
      - run: npm run test:formal:unit
      - run: npm run test:acceptance:cli
      - run: node --test scripts/agent/*.test.mjs
      - run: npm run check:boundaries
      - run: npm run test:build-policy
      - run: npm run test:diagnostics
      - run: npm run test:fuzz
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-24
        with:
          fetch-depth: 0 # Unsigned distribution binds documentation to immutable source commits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, official ref checked 2026-10-24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3, official annotated tag dereferenced
        with:
          chrome-version: stable
      - name: Verify one actual browser POST for a withheld Solana acknowledgment
        run: npm run test:solana:ack:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - name: Verify acknowledged Solana restore with the actual encrypted Worker
        run: npm run test:solana:restore:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:portal:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:distribution:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:web:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:favorites:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:templates:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:private:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:locator:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:chat:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:diagnostics:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:recovery:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:peer:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run test:locale:browser
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - name: Verify isolated-peer live and stored signed-offer discovery
        run: node scripts/test-peer-offer-browser.mjs
        env:
          P2P_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
  docs-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-24
        with:
          fetch-depth: 0 # Immutable source/document evidence resolves historical commits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, official ref checked 2026-10-24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:tooling
      - run: npm run check:docs
      - run: npm run check:governance
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, official ref checked 2026-10-24
        with:
          python-version: '3.12'
      - name: Install pinned independent crypto oracle
        run: |
          python -m pip --isolated install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r scripts/tests/requirements-crypto.txt
      - run: npm run test:specs
      - run: npm run check:specs
