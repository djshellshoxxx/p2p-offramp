name: Solana escrow
on:
  push:
    branches: [main]
    paths:
      - 'contracts/solana/**'
      - 'packages/chain-solana/**'
      - 'packages/domain/**'
      - 'packages/schemas/**'
      - 'packages/storage/**'
      - 'packages/security/**'
      - 'apps/web/**'
      - 'scripts/lib/solana-localnet-*.mjs'
      - 'scripts/lib/chromium-path.mjs'
      - 'scripts/test-solana-localnet-browser.mjs'
      - 'scripts/test-support/register-tsx.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/domain/test/fixtures/g16-vectors.json'
      - '.github/workflows/solana-escrow.yml'
  pull_request:
    paths:
      - 'contracts/solana/**'
      - 'packages/chain-solana/**'
      - 'packages/domain/**'
      - 'packages/schemas/**'
      - 'packages/storage/**'
      - 'packages/security/**'
      - 'apps/web/**'
      - 'scripts/lib/solana-localnet-*.mjs'
      - 'scripts/lib/chromium-path.mjs'
      - 'scripts/test-solana-localnet-browser.mjs'
      - 'scripts/test-support/register-tsx.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/domain/test/fixtures/g16-vectors.json'
      - '.github/workflows/solana-escrow.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  program:
    runs-on: ubuntu-latest
    # Both independent validator gates wait through the contract's 1800-second refund minimum.
    timeout-minutes: 150
    env:
      AGAVE_VERSION: v4.1.2
      # SHA-256 of solana-release-x86_64-unknown-linux-gnu.tar.bz2 recorded at first download (2026-11-04).
      AGAVE_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
      ANCHOR_VERSION: 1.2.2
      ANCHOR_SHA256: e2c35a973bcfe476f3a89b120e99820f917229faf33d3e71f6625bd94199e741
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-24
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, official ref checked 2026-10-24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Independent JavaScript vectors
        run: |
          node contracts/solana/vectors/derive.mjs --check
          node --test contracts/solana/vectors/derive.test.mjs
      # Restore on every run; save (last step) only on a push to main, so a pull_request run can never seed the
      # cache that main restores. restore/ and save/ exist at this v4.3.0 commit (checked 2026-11-18).
      - id: solana-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0, tag resolved 2026-11-04
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cache/solana
          key: solana-deps-${{ runner.os }}-agave-v4.1.2-${{ hashFiles('contracts/solana/Cargo.lock') }}
      - name: Install pinned Agave and Anchor CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/agave.tar.bz2" \
            "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum -c
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v$ANCHOR_VERSION/anchor-$ANCHOR_VERSION-x86_64-unknown-linux-gnu"
          echo "$ANCHOR_SHA256  $RUNNER_TEMP/anchor" | sha256sum -c
          chmod 755 "$RUNNER_TEMP/anchor"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Rust toolchain from rust-toolchain.toml
        working-directory: contracts/solana
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        working-directory: contracts/solana
        run: cargo fmt --check
      - name: Build program (SBPF v3, platform-tools v1.54)
        working-directory: contracts/solana
        run: cargo build-sbf --manifest-path programs/basic-escrow/Cargo.toml --features localnet --arch v3 -- --locked
      # The LiteSVM tests embed target/deploy/basic_escrow.so, so lint of all targets runs after the build.
      - name: Lint
        working-directory: contracts/solana
        run: cargo clippy --locked --features localnet --all-targets -- -D warnings
      - name: LiteSVM tests (original SPL Token 3.5.0 and p-token)
        working-directory: contracts/solana
        run: cargo test --locked --features localnet
      - name: Verify committed IDL is current
        working-directory: contracts/solana
        run: |
          anchor idl build -p basic_escrow -o "$RUNNER_TEMP/basic_escrow.json" -- --features localnet --locked
          diff -u idl/basic_escrow.json "$RUNNER_TEMP/basic_escrow.json"
      - name: Real validator client acceptance including refund and recovery
        timeout-minutes: 50
        env:
          SOLANA_LOCALNET_DIR: ${{ github.workspace }}/contracts/solana/target/client-localnet
        run: node --import ./scripts/test-support/register-tsx.mjs contracts/solana/localnet/client-run.mjs
      - name: Chromium for actual native browser composition
        id: solana-chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # Same pinned revision as the existing browser gate.
        with:
          chrome-version: stable
      - name: Actual Worker encrypted Solana recovery and real-time refund
        timeout-minutes: 60
        env:
          P2P_CHROMIUM: ${{ steps.solana-chrome.outputs.chrome-path }}
        run: npm run test:solana:browser
      - name: Save dependency cache (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.solana-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0, tag resolved 2026-11-04
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cache/solana
          key: ${{ steps.solana-cache.outputs.cache-primary-key }}
