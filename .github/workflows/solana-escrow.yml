name: Solana escrow
on:
  push:
    branches: [main]
    paths:
      - 'contracts/solana/**'
      - 'packages/domain/test/fixtures/g16-vectors.json'
      - '.github/workflows/solana-escrow.yml'
  pull_request:
    paths:
      - 'contracts/solana/**'
      - 'packages/domain/test/fixtures/g16-vectors.json'
      - '.github/workflows/solana-escrow.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGAVE_VERSION: v4.1.2
      # SHA-256 of solana-release-x86_64-unknown-linux-gnu.tar.bz2 recorded at first download (2026-11-04).
      AGAVE_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
      ANCHOR_VERSION: 1.2.2
      ANCHOR_SHA256: e2c35a973bcfe476f3a89b120e99820f917229faf33d3e71f6625bd94199e741
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, official ref checked 2026-10-24
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, official ref checked 2026-10-24
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Independent JavaScript vectors
        run: |
          node contracts/solana/vectors/derive.mjs --check
          node --test contracts/solana/vectors/derive.test.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0, tag resolved 2026-11-04
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cache/solana
          key: solana-deps-${{ runner.os }}-agave-v4.1.2-${{ hashFiles('contracts/solana/Cargo.lock') }}
      - name: Install pinned Agave and Anchor CLI
        run: |
          curl -sSfL -o "$RUNNER_TEMP/agave.tar.bz2" \
            "https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "$AGAVE_SHA256  $RUNNER_TEMP/agave.tar.bz2" | sha256sum -c
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP"
          curl -sSfL -o "$RUNNER_TEMP/anchor" \
            "https://github.com/solana-foundation/anchor/releases/download/v$ANCHOR_VERSION/anchor-$ANCHOR_VERSION-x86_64-unknown-linux-gnu"
          echo "$ANCHOR_SHA256  $RUNNER_TEMP/anchor" | sha256sum -c
          chmod 755 "$RUNNER_TEMP/anchor"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Rust toolchain from rust-toolchain.toml
        working-directory: contracts/solana
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format and lint
        working-directory: contracts/solana
        run: |
          cargo fmt --check
          cargo clippy --locked --features localnet --all-targets -- -D warnings
      - name: Build program (SBPF v0, platform-tools v1.54)
        working-directory: contracts/solana
        run: cargo build-sbf --manifest-path programs/basic-escrow/Cargo.toml --features localnet -- --locked
      - name: LiteSVM tests (original SPL Token 3.5.0 and p-token)
        working-directory: contracts/solana
        run: cargo test --locked --features localnet
      - name: Verify committed IDL is current
        working-directory: contracts/solana
        run: |
          anchor idl build -p basic_escrow -o "$RUNNER_TEMP/basic_escrow.json" -- --features localnet --locked
          diff -u idl/basic_escrow.json "$RUNNER_TEMP/basic_escrow.json"
