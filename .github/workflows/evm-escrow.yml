name: EVM escrow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge --version
      - run: forge build --sizes
      - run: forge test -vvv
      - name: Verify committed ABI is current
        run: |
          bash script/export-abi.sh
          git diff --exit-code -- abi/BasicEscrow.json
