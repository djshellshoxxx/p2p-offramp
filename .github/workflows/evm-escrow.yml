name: EVM escrow
on:
  push:
    branches: [main]
  pull_request:
# Cancel superseded runs of the same workflow and ref (first-party feature, no new actions).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.5.1
      - run: forge --version
      - run: forge build --sizes
      - run: forge test -vvv
      - name: Verify committed ABI is current
        run: |
          bash script/export-abi.sh
          git diff --exit-code -- abi/BasicEscrow.json
  local-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.5.1
      - run: npm ci --ignore-scripts
      - name: Verify wallet calldata against the independent Foundry oracle
        run: |
          cast --version
          node --import ./scripts/test-support/register-tsx.mjs --test packages/wallet/test/evm-escrow.test.mjs
      - run: npm run test:evm:local
      - run: npm run test:exchange:evm
      - run: npm run test:evm:viem
      - run: npm run test:payment:preflight
      - run: npm run test:evm:reconcile
      - run: npm run test:recovery:evm
      - run: npm run test:sepolia:kit
      - run: npm run test:sepolia:trade
      - run: npm run test:localnet:controller
      - run: npm run test:localnet:erc20
      - name: Install Chromium for the built localnet journey
        id: localnet-chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce
        with:
          chrome-version: stable
      - name: Qualify separate buyer and seller browser profiles
        run: npm run test:localnet:browser
        env:
          P2P_CHROMIUM: ${{ steps.localnet-chrome.outputs.chrome-path }}
      - name: Qualify reviewed token allowances and ERC-20 browser exits
        run: npm run test:localnet:erc20:browser
        env:
          P2P_CHROMIUM: ${{ steps.localnet-chrome.outputs.chrome-path }}
