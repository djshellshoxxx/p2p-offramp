name: EVM escrow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/evm
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge --version
      - run: forge build --sizes
      - run: forge test -vvv
      - name: Verify committed ABI is current
        run: |
          bash script/export-abi.sh
          git diff --exit-code -- abi/BasicEscrow.json
  local-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: npm ci --ignore-scripts
      - run: npm run test:evm:local
      - run: npm run test:evm:reconcile
      - run: npm run test:sepolia:kit
