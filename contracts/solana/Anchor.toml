# Build with `cargo build-sbf --features localnet` (see README.md); `anchor build` defaults to
# platform-tools v1.57/SBPF v3, which the pinned Agave v4.1.2 toolchain does not ship.
[toolchain]
anchor_version = "1.2.2"
solana_version = "4.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
basic_escrow = "7q2EChqznfQea58ZfUvBzRd97Bc28kwHaey1tYy7ADjq"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test --features localnet"
